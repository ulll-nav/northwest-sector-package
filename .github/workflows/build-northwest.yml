name: Build northwest sector

on:
  workflow_dispatch:


jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: northwest-sync
      cancel-in-progress: false
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
      ORG: ulll-nav

    steps:
    - name: Checkout Northwest
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
        token: ${{ env.PAT }}

    - name: Configure Git identity
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Fetch ULLL into temp
      run: |
        git remote add ul https://x-access-token:${{ env.PAT }}@github.com/${{ env.ORG }}/ulll-sector-package.git || true
        git fetch ul main
        mkdir -p /tmp/ulll
        git --work-tree=/tmp/ulll checkout ul/main -- . ':(exclude).github'

    - name: Fetch UMKK into temp
      run: |
        git remote add um https://x-access-token:${{ env.PAT }}@github.com/${{ env.ORG }}/umkk-sector-package.git || true
        git fetch um main
        mkdir -p /tmp/umkk
        git --work-tree=/tmp/umkk checkout um/main -- . ':(exclude).github'

    - name: Fetch shared into temp
      run: |
        git remote add sh https://x-access-token:${{ env.PAT }}@github.com/${{ env.ORG }}/shared-sector-package.git || true
        git fetch sh main
        mkdir -p /tmp/shared
        git --work-tree=/tmp/shared checkout sh/main -- . ':(exclude).github'

    - name: Prepare build directory
      run: |
        rm -rf /tmp/build
        mkdir -p /tmp/build

    - name: Read common manifest
      id: manifest
      run: |
        common=$(python3 << 'PY'
        import yaml
        with open('/tmp/shared/common.yml') as f:
            data = yaml.safe_load(f)
            lst = data.get('common', [])
        print(','.join(lst))
        PY
        )
        echo "common_folders=${common}" >> "$GITHUB_OUTPUT"

    - name: Sync ULLL specific content
      run: |
        IFS=',' read -ra COMMON <<< "${{ steps.manifest.outputs.common_folders }}"

        EXCLUDES=()
        for F in "${COMMON[@]}"; do
          EXCLUDES+=(--exclude="$F/")
        done

        python3 -c "
        import yaml
        with open('.github/northwest-mapping.yml') as f:
            m = yaml.safe_load(f)
        for e in m.get('ulll', {}).get('exclude', []):
            print(e)
        " | while read E; do
          EXCLUDES+=(--exclude="$E")
        done

        mkdir -p ULLL
        rsync -a --exclude='.git' --exclude='.github' "${EXCLUDES[@]}" /tmp/ulll/ULLL/ /tmp/build/ULLL/

        # PRF ULLL
        rsync -a --include='*.prf' --exclude='*' /tmp/ulll/ /tmp/build/

    - name: Sync common content from shared
      run: |
        IFS=',' read -ra COMMON <<< "${{ steps.manifest.outputs.common_folders }}"

        for F in "${COMMON[@]}"; do
          SRC="/tmp/shared/$F"
          [ -d "$SRC" ] || continue

          DST="/tmp/build/ULLL/$F"
          mkdir -p "$DST"

          rsync -a --delete "$SRC/" "$DST/"
        done

    - name: Sync UMKK specific content
      run: |
        python3 << 'PY'
        import yaml, subprocess, os

        with open('.github/northwest-mapping.yml') as f:
            mapping = yaml.safe_load(f)

        # PRF UMKK
        if mapping.get('umkk', {}).get('prf'):
            subprocess.run([
                'rsync', '-a',
                '--include=*.prf', '--exclude=*',
                '/tmp/umkk/', '/tmp/build/'
            ], check=True)

        for entry in mapping.get('umkk', {}).get('folders', []):
            src = os.path.join('/tmp/umkk', entry['from'])
            dst = os.path.join('/tmp/build', entry['to'])

            os.makedirs(dst, exist_ok=True)

            subprocess.run([
                'rsync', '-a', src, dst
            ], check=True)

            print(f"Synced {src} → {dst}")
        PY

    - name: Replace \UMKK → \ULLL in .prf
      run: |
        find /tmp/build -type f -name '*.prf' -print0 | xargs -0 sed -i 's|\\UMKK\\|\\ULLL\\|g'

    - name: Replace repo content with build directory
      run: |
        find . -mindepth 1 -maxdepth 1 \
          ! -name '.git' \
          ! -name '.github' \
          -exec rm -rf {} +

        rsync -a /tmp/build/ ./

    - name: Cleanup temp
      run: rm -rf /tmp/ulll /tmp/umkk /tmp/shared /tmp/build

    - name: Commit & push
      run: |
        git add -A

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit \
            --author="${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>" \
            -m "build: sync from ULLL/UMKK/shared by ${{ github.actor }}"
          git push origin main --force-with-lease
        fi
